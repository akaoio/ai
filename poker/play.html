<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🃏 Poker vs AI</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0 }
body { background: #1a2a1a; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-bottom: 16px; }
h1 { margin: 10px 0 4px; color: #ffd700; font-size: clamp(1em, 4vw, 1.4em); letter-spacing: 2px; }
#info-bar { font-size: clamp(.7em, 2.5vw, .8em); color: #aaa; margin-bottom: 6px; text-align: center; padding: 0 8px; }

/* ── Arena: seats + table stacked vertically ── */
#arena { width: min(760px, calc(100vw - 12px)); margin: 0 auto; }

/* Seat rows */
.seat-row { display: flex; gap: 4px; padding: 4px 0; }
.seat-row.top { border-bottom: none; }
.seat-row.bottom { border-top: none; }

/* Seat box */
.seat { flex: 1 1 0; min-width: 0; background: #1c3a1c; border: 1px solid #2d5a2d; border-radius: 8px; padding: 5px 4px; text-align: center; transition: border-color .2s; }
.seat.active { border-color: #ff0; box-shadow: 0 0 6px #ff06; }
.seat.folded { opacity: .38; }
.seat.you { border-color: #4488cc; background: #152535; }
.seat .pname { font-size: clamp(.65em, 2.2vw, .78em); font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat.active .pname { color: #ff0; }
.seat.dealer .pname::before { content: "🔘 "; }
.seat.you .pname { color: #8cf; }
.seat .pstack { font-size: clamp(.6em, 2vw, .7em); color: #cfc; }
.seat .pbet { font-size: clamp(.58em, 1.8vw, .66em); color: #ffc; height: 14px; overflow: hidden; }
.seat .cards { display: flex; gap: 2px; justify-content: center; margin-top: 3px; flex-wrap: wrap; }

/* Cards */
.card { width: clamp(22px, 5.5vw, 32px); height: clamp(30px, 7.5vw, 46px); border-radius: 3px; background: #fffde7; color: #222; display: flex; align-items: center; justify-content: center; font-size: clamp(.55em, 1.8vw, .75em); font-weight: bold; border: 1px solid #bbb; line-height: 1; flex-direction: column; }
.card.red { color: #c00; }
.card.back { background: #2244aa; color: #fff; font-size: 1em; }
.card.community-card { width: clamp(28px, 7vw, 44px); height: clamp(38px, 9.5vw, 62px); font-size: clamp(.65em, 2.2vw, .95em); }

/* Action badges */
.paction-slot { height: 18px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.paction { display: inline-block; padding: 1px 5px; border-radius: 8px; font-size: clamp(.52em, 1.6vw, .63em); font-weight: bold; white-space: nowrap; }
.act-fold { background: #611; color: #faa; }
.act-check { background: #163; color: #afa; }
.act-call { background: #124; color: #acf; }
.act-raise { background: #541; color: #fca; }
.act-allin { background: #720; color: #ffd700; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }

/* ── Felt (community + pot only, no seats) ── */
#table-wrap { position: relative; width: 100%; aspect-ratio: 5/2; }
#felt { width: 100%; height: 100%; background: radial-gradient(ellipse at center, #2d6a2d 55%, #1a4a1a 100%); border-radius: 12px; border: 5px solid #8b5e1a; box-shadow: 0 0 24px #000a, inset 0 0 16px #0005; }
#community { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -55%); display: flex; gap: clamp(3px, 1.2vw, 8px); }
#pot-label { position: absolute; top: 60%; left: 50%; transform: translate(-50%, 0); font-size: clamp(.75em, 2.8vw, 1em); color: #ffd700; font-weight: bold; }

/* ── Controls ── */
#controls { margin: 8px auto; width: min(760px, calc(100vw - 12px)); background: #111; border-radius: 10px; padding: 10px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#controls button { padding: 10px clamp(8px, 2.5vw, 18px); border-radius: 6px; border: none; font-size: clamp(.78em, 2.8vw, .9em); cursor: pointer; font-weight: bold; transition: opacity .15s; min-height: 44px; touch-action: manipulation; flex: 1 1 auto; }
#controls button:disabled { opacity: .3; cursor: not-allowed; }
#btn-fold { background: #922; color: #fff; }
#btn-check { background: #494; color: #fff; }
#btn-call { background: #226; color: #fff; }
#btn-raise { background: #854; color: #fff; }
#btn-allin { background: #722; color: #ffd700; border: 1px solid #ffd70066; }
#raise-amount { width: clamp(68px, 15vw, 90px); padding: 8px; border-radius: 5px; border: 1px solid #555; background: #222; color: #eee; font-size: clamp(.78em, 2.8vw, .9em); min-height: 44px; touch-action: manipulation; }
#raise-hint { font-size: clamp(.65em, 2vw, .74em); color: #aaa; }
#btn-new { background: #555; color: #fff; flex: 0 0 auto; }
#action-status { font-size: clamp(.72em, 2.5vw, .82em); color: #fa8; font-style: italic; width: 100%; order: 99; }

/* ── Log ── */
#log-wrap { margin: 0 auto 0; width: min(760px, calc(100vw - 12px)); background: #111; border-radius: 10px; padding: 8px 12px; max-height: 120px; overflow-y: auto; }
#log-wrap .entry { font-size: clamp(.68em, 2.2vw, .76em); padding: 2px 0; border-bottom: 1px solid #222; }
#log-wrap .entry.divider { color: #ffd700; font-style: italic; padding-top: 4px; }
#log-wrap .entry.you { color: #8cf; }

/* result overlay */
#result-overlay { display: none; position: fixed; inset: 0; background: #000a; justify-content: center; align-items: center; z-index: 10; padding: 16px; }
#result-overlay.visible { display: flex; }
#result-box { background: #223; border: 2px solid #ffd700; border-radius: 14px; padding: clamp(16px, 5vw, 28px) clamp(20px, 6vw, 36px); text-align: center; max-width: min(400px, calc(100vw - 32px)); width: 100%; }
#result-box h2 { color: #ffd700; font-size: clamp(1.1em, 4vw, 1.4em); margin-bottom: 10px; }
#result-box .reveal { margin: 6px 0; font-size: clamp(.76em, 2.5vw, .85em); }
#result-box button { margin-top: 16px; padding: 10px 24px; background: #ffd700; border: none; border-radius: 6px; font-size: clamp(.9em, 3vw, 1em); font-weight: bold; cursor: pointer; min-height: 44px; touch-action: manipulation; }
</style>
</head>
<body>
<h1>🃏 Poker vs AI</h1>
<div id="info-bar">Loading…</div>

<div id="arena">
  <!-- Top opponents row: left · center · right -->
  <div class="seat-row top">
    <div id="s2" class="seat"></div>
    <div id="s3" class="seat"></div>
    <div id="s4" class="seat"></div>
  </div>

  <!-- Felt: community cards + pot only -->
  <div id="table-wrap">
    <div id="felt"></div>
    <div id="community"></div>
    <div id="pot-label"></div>
  </div>

  <!-- Bottom row: left · YOU · right -->
  <div class="seat-row bottom">
    <div id="s1" class="seat"></div>
    <div id="s0" class="seat"></div>
    <div id="s5" class="seat"></div>
  </div>
</div>

<div id="controls">
  <button id="btn-fold" disabled>Fold</button>
  <button id="btn-check" disabled>Check</button>
  <button id="btn-call" disabled>Call</button>
  <button id="btn-raise" disabled>Raise</button>
  <button id="btn-allin" disabled>All In</button>
  <input id="raise-amount" type="number" placeholder="amount" style="display:none">
  <span id="raise-hint"></span>
  <span id="action-status"></span>
  <button id="btn-new">New Game</button>
</div>

<div id="log-wrap"><div id="log"></div></div>

<div id="result-overlay">
  <div id="result-box">
    <h2 id="result-title"></h2>
    <div id="result-body"></div>
    <button id="btn-next">Next Hand ▶</button>
  </div>
</div>

<script src="play.js"></script>
</body>
</html>
