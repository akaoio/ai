<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🃏 Poker vs AI</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0 }
body { background: #1a2a1a; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
h1 { margin: 16px 0 6px; color: #ffd700; font-size: 1.4em; letter-spacing: 2px; }
#info-bar { font-size: .8em; color: #aaa; margin-bottom: 10px; }

/* ── Table ── */
#table-wrap { position: relative; width: 760px; height: 420px; margin: 0 auto; }
#felt { width: 100%; height: 100%; background: radial-gradient(ellipse at center, #2d6a2d 60%, #1a4a1a 100%); border-radius: 50%; border: 6px solid #8b5e1a; box-shadow: 0 0 40px #000a; }

/* Community */
#community { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -55%); display: flex; gap: 8px; }
#pot-label { position: absolute; top: 58%; left: 50%; transform: translate(-50%, 0); font-size: 1em; color: #ffd700; font-weight: bold; }

/* Seats */
.seat { position: absolute; text-align: center; width: 110px; }
.seat .pname { font-size: .72em; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat .pstack { font-size: .68em; color: #cfc; }
.seat .pbet { font-size: .62em; color: #ffc; min-height: 14px; }
.seat .cards { display: flex; gap: 3px; justify-content: center; margin-top: 2px; }
.seat.active .pname { color: #ff0; text-shadow: 0 0 6px #ff0; }
.seat.folded { opacity: .35; }
.seat.dealer .pname::before { content: "🔘 "; }
.seat.you .pname { color: #8cf; }

/* Cards */
.card { width: 32px; height: 46px; border-radius: 4px; background: #fffde7; color: #222; display: flex; align-items: center; justify-content: center; font-size: .75em; font-weight: bold; border: 1px solid #bbb; line-height: 1; flex-direction: column; }
.card.red { color: #c00; }
.card.back { background: #2244aa; color: #fff; font-size: 1em; }
.card.community-card { width: 44px; height: 62px; font-size: .95em; }

/* ── Controls ── */
#controls { margin: 12px auto; width: 760px; background: #111; border-radius: 10px; padding: 12px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
#controls button { padding: 8px 18px; border-radius: 6px; border: none; font-size: .9em; cursor: pointer; font-weight: bold; transition: opacity .15s; }
#controls button:disabled { opacity: .3; cursor: not-allowed; }
#btn-fold { background: #922; color: #fff; }
#btn-check { background: #494; color: #fff; }
#btn-call { background: #226; color: #fff; }
#btn-raise { background: #854; color: #fff; }
#raise-amount { width: 80px; padding: 6px 8px; border-radius: 5px; border: 1px solid #555; background: #222; color: #eee; font-size: .9em; }
#raise-hint { font-size: .75em; color: #aaa; }
#btn-new { background: #555; color: #fff; margin-left: auto; }
#action-status { font-size: .82em; color: #fa8; font-style: italic; }

/* ── Log ── */
#log-wrap { margin: 0 auto 20px; width: 760px; background: #111; border-radius: 10px; padding: 8px 12px; max-height: 150px; overflow-y: auto; }
#log-wrap .entry { font-size: .78em; padding: 2px 0; border-bottom: 1px solid #222; }
#log-wrap .entry.divider { color: #ffd700; font-style: italic; padding-top: 4px; }
#log-wrap .entry.you { color: #8cf; }

/* ── Seat positions around ellipse ── */
#s0 { bottom: 12px; left: 50%; transform: translateX(-50%); }   /* bottom center = human */
#s1 { bottom: 80px; left: 80px; }
#s2 { top: 100px; left: 30px; }
#s3 { top: 20px; left: 50%; transform: translateX(-50%); }
#s4 { top: 100px; right: 30px; }
#s5 { bottom: 80px; right: 80px; }

/* result overlay */
#result-overlay { display: none; position: fixed; inset: 0; background: #000a; justify-content: center; align-items: center; z-index: 10; }
#result-overlay.visible { display: flex; }
#result-box { background: #223; border: 2px solid #ffd700; border-radius: 14px; padding: 28px 36px; text-align: center; max-width: 400px; }
#result-box h2 { color: #ffd700; font-size: 1.4em; margin-bottom: 10px; }
#result-box .reveal { margin: 6px 0; font-size: .85em; }
#result-box button { margin-top: 16px; padding: 8px 24px; background: #ffd700; border: none; border-radius: 6px; font-size: 1em; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<h1>🃏 Poker vs AI</h1>
<div id="info-bar">Loading…</div>

<div id="table-wrap">
  <div id="felt"></div>
  <div id="community"></div>
  <div id="pot-label"></div>
  <!-- seats filled by JS -->
</div>

<div id="controls">
  <button id="btn-fold" disabled>Fold</button>
  <button id="btn-check" disabled>Check</button>
  <button id="btn-call" disabled>Call</button>
  <button id="btn-raise" disabled>Raise</button>
  <input id="raise-amount" type="number" placeholder="amount" style="display:none">
  <span id="raise-hint"></span>
  <span id="action-status"></span>
  <button id="btn-new">New Game</button>
</div>

<div id="log-wrap"><div id="log"></div></div>

<div id="result-overlay">
  <div id="result-box">
    <h2 id="result-title"></h2>
    <div id="result-body"></div>
    <button id="btn-next">Next Hand ▶</button>
  </div>
</div>

<script src="play.js"></script>
</body>
</html>
